<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SBeans</title>
    <link rel="stylesheet" href="/styles.css?v=20260907-3" />
  </head>
  <body>
    <header>
      <div><strong>SBeans</strong><span>Student Beans 登录台</span></div>
      <button id="logout" class="icon" title="退出" aria-label="退出">&#x21AA;</button>
    </header>
    <main>
      <section id="unlock" class="auth-panel">
        <h1>面板登录</h1>
        <p>输入本机部署密码</p>
        <form id="unlock-form">
          <label for="admin-password">面板密码</label>
          <input id="admin-password" type="password" autocomplete="current-password" required />
          <button type="submit">进入面板</button>
        </form>
      </section>

      <section id="workspace" hidden>
        <div class="workspace-head">
            <nav class="tabs" aria-label="面板视图">
              <button type="button" class="tab active" data-view="login-view">登录任务</button>
              <button type="button" class="tab" data-view="records-view">账号记录</button>
              <button type="button" class="tab" data-view="code-library-view">优惠码库</button>
              <button type="button" class="tab" data-view="settings-view">面板设置</button>
          </nav>
          <span id="health">后端检查中</span>
        </div>

        <section id="login-view" class="view">
          <div class="section-head">
            <div><h1>登录任务</h1><p>任务按账号并发执行，页面与验证会充分等待加载。</p></div>
            <div class="actions">
              <label class="check"><input id="retry-waf" type="checkbox" form="login-form" /> WAF 识别失败时重试一次</label>
              <label class="check"><input id="debug" type="checkbox" form="login-form" /> 保存调试截图</label>
              <button id="stop" type="button" class="secondary" hidden>结束任务</button>
              <button id="submit" type="submit" form="login-form">开始登录</button>
            </div>
          </div>
          <form id="login-form" class="login-grid">
            <div class="saved-record-panel">
              <label>已保存账号</label>
              <div id="record-picker" class="record-picker"><p class="empty">暂无账号记录</p></div>
            </div>
            <div class="task-panels">
              <div class="proxy-panel">
                <label for="proxies">代理池</label>
                <textarea id="proxies" rows="6" placeholder="user:pass@host:port&#10;host:port:user:pass"></textarea>
                <small>可留空直连；按行轮换，保存在当前浏览器。</small>
              </div>
              <div class="log-panel">
                <div class="log-head"><label>实时日志</label><button id="clear-log" type="button" class="secondary small-button">清空</button></div>
                <div id="live-log" class="live-log" aria-live="polite"><p class="empty">等待任务开始</p></div>
              </div>
            </div>
          </form>
          <div id="notice" role="alert"></div>
          <section id="results" hidden><h2>执行结果</h2><div id="result-list"></div></section>
        </section>

        <section id="records-view" class="view" hidden>
          <div class="section-head"><div><h1>账号记录</h1><p>账号密码加密保存在服务器，列表不显示密码。</p></div></div>
          <form id="record-form" class="record-form">
            <div><label for="record-email">账号</label><input id="record-email" type="email" required /></div>
            <div><label for="record-password">密码（可留空）</label><input id="record-password" type="password" autocomplete="off" placeholder="留空使用面板默认密码" /></div>
            <div><label for="record-time">时间</label><input id="record-time" type="text" placeholder="留空自动填当前时间（新加坡）" /></div>
            <button type="submit">添加记录</button>
          </form>
          <div id="records-notice" class="inline-notice" role="alert"></div>
          <div id="records-list" class="records-list"><p class="empty">暂无账号记录</p></div>
        </section>

        <section id="code-library-view" class="view" hidden>
          <div class="section-head"><div><h1>优惠码库</h1><p>成功拿到完整四组优惠码的账号会自动归档，可展开条目复制码和日期。</p></div></div>
          <div id="code-library-toolbar" class="library-toolbar" hidden>
            <label class="check library-select-all"><input id="code-library-select-all" type="checkbox" /> 全选本页</label>
            <span id="code-library-selection-count" class="library-selection-count">已选 0 条</span>
            <button id="delete-code-library" type="button" class="danger small-button" disabled>删除</button>
            <div class="library-pagination" aria-label="优惠码库分页">
              <button id="code-library-previous" type="button" class="secondary page-button" title="上一页" aria-label="上一页">&lsaquo;</button>
              <span id="code-library-page-status">第 1 / 1 页</span>
              <button id="code-library-next" type="button" class="secondary page-button" title="下一页" aria-label="下一页">&rsaquo;</button>
            </div>
          </div>
          <div id="code-library-notice" class="inline-notice library-notice" role="alert"></div>
          <div id="code-library-list" class="code-library-list"><p class="empty">暂无已归档的四组优惠码</p></div>
        </section>

        <section id="settings-view" class="view" hidden>
          <div class="section-head"><div><h1>面板设置</h1><p>账号密码和面板数据都保存在服务器密文中。</p></div></div>
          <div class="settings-grid">
            <div class="settings-block">
              <h2>默认账号密码</h2>
              <p id="default-account-password-state" class="settings-state">检查中</p>
              <form id="default-account-password-form" class="settings-form">
                <label for="default-account-password">新默认密码</label>
                <input id="default-account-password" type="password" autocomplete="new-password" required />
                <button type="submit">保存默认密码</button>
              </form>
              <div id="default-account-password-notice" class="inline-notice" role="alert"></div>
            </div>
            <div class="settings-block">
              <h2>面板密码</h2>
              <form id="password-form" class="settings-form">
                <label for="current-password">当前面板密码</label>
                <input id="current-password" type="password" autocomplete="current-password" required />
                <label for="new-password">新面板密码</label>
                <input id="new-password" type="password" autocomplete="new-password" required />
                <label for="confirm-password">确认新密码</label>
                <input id="confirm-password" type="password" autocomplete="new-password" required />
                <button type="submit">修改密码</button>
              </form>
              <div id="password-notice" class="inline-notice" role="alert"></div>
            </div>
          </div>
        </section>
      </section>
    </main>
    <script src="/app.js?v=20260907-3"></script>
  </body>
</html>
