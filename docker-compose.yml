version: "3.8"

services:
  flaresolverr:
    build:
      context: ./flaresolverr
      dockerfile: Dockerfile
    environment:
      LOG_LEVEL: info
      CAPTCHA_SOLVER: none
      VISION_API_URL: ${VISION_API_URL:-}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-}
      VISION_API_MODE: ${VISION_API_MODE:-chat_completions}
      VISION_AUTH_HEADER: ${VISION_AUTH_HEADER:-Authorization}
      VISION_AUTH_PREFIX: ${VISION_AUTH_PREFIX:-Bearer}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SBEANS_TURNSTILE_SITEKEY: 0x4AAAAAAA06-AYUI0e5uiaW
      TZ: UTC
    expose:
      - "8191"
    restart: unless-stopped
    shm_size: "2gb"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8191/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: .
    environment:
      SBEANS_ADMIN_PASSWORD: ${SBEANS_ADMIN_PASSWORD:?set SBEANS_ADMIN_PASSWORD in .env}
      SBEANS_SCREENSHOT_DIR: /data/screenshots
      SBEANS_STORE_PATH: /data/secure_store.json
      SBEANS_FLARESOLVERR_URL: http://flaresolverr:8191/v1
    expose:
      - "8085"
    volumes:
      - ./data:/data
    depends_on:
      - flaresolverr
    restart: unless-stopped
    shm_size: "1gb"

  frontend:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8087:8087"
    volumes:
      - ./front:/usr/share/nginx/html:ro
      - ./front/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
